# ==============================================================================
# Nginx Reverse Proxy Configuration for Kundli Engine on Hostinger VPS
# Place in /etc/nginx/sites-available/kundli and symlink to sites-enabled/
# ==============================================================================

# Rate limiting zone to protect VPS resources from abuse
limit_req_zone $binary_remote_addr zone=kundli_api_limit:10m rate=25r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g. kundli.yourdomain.com)

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    client_max_body_size 10M;

    # Kundli Application Reverse Proxy
    location / {
        limit_req zone=kundli_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # WebSocket & connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for computation-heavy requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
