# ==============================================================================
# Nginx Reverse Proxy with SSL for Prod_Kundli (kundli-api.bhagyanetram.com)
# Place in /etc/nginx/conf.d/kundli.conf
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name kundli-api.bhagyanetram.com;

    return 301 https://$host$request_uri;
}

# 2. HTTPS Secure Reverse Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kundli-api.bhagyanetram.com;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/kundli-api.bhagyanetram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kundli-api.bhagyanetram.com/privkey.pem;

    # SSL Protocols & Performance Tuning
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    client_max_body_size 10M;

    # Proxy to Node.js Express MERN Server on port 8005
    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy astrological calculations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
